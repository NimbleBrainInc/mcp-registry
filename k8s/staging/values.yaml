replicaCount: 1

image:
  repository: 533267450054.dkr.ecr.us-east-1.amazonaws.com/mcp-registry
  # tag is set by Makefile via --set image.tag=

containerPort: 8080

service:
  port: 8080

ingress:
  host: registry.preview.nimblebrain.ai
  certificateArn: arn:aws:acm:us-east-1:533267450054:certificate/9d77bd52-139e-4e05-8ded-c8ccaf9b35b8

healthCheck:
  path: /v0.1/health

env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

externalSecret:
  enabled: false

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
